# The claims in this repo go stale because the WORLD changes -- a new git, a new
# CPython, a new macOS -- not because the repo changes. So this runs on a schedule,
# and on pull_request only to catch a broken probe.
name: verify

on:
  schedule:
    - cron: '17 6 * * 1'        # Mondays, 06:17 UTC
  pull_request:
    paths: ['verify/**', '.github/workflows/verify.yml']
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # Without GNU timeout the multiprocessing probe skips, and the run goes green
      # having never checked the spawn-runaway claim. Install it rather than let a
      # blind pass look like a pass.
      - name: GNU coreutils (macOS ships no timeout)
        if: runner.os == 'macOS'
        run: brew install coreutils

      - name: Record what we are testing against
        run: |
          uname -a
          for t in bash zsh git rsync rg sed python3 cc docker timeout gtimeout; do
            printf '%-8s %s\n' "$t" "$(command -v $t || echo -)"
          done
          git --version; python3 -VV
      - run: ./verify/run.sh
